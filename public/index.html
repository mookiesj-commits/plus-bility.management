<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6256d9"><title>+BILITY 통합관리 4차</title><style>
:root{
 --nav:#1d1f2c;--nav2:#262a3a;--navText:#cbd0dd;--bg:#f4f6f9;--card:#fff;--line:#e8eaf0;
 --text:#202435;--muted:#8991a4;--purple:#6256d9;--purple2:#756be7;--green:#2d9d71;
 --orange:#d59a39;--red:#c95e62;--blue:#4d6ecb;--shadow:0 10px 30px rgba(28,34,54,.07)
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Arial,"Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:228px;background:linear-gradient(180deg,#1c1e2a,#202231);color:var(--navText);padding:20px 14px;z-index:30}
.brandLogo{height:142px;display:flex;justify-content:center;align-items:flex-start;padding-top:4px;margin-bottom:10px}.brandLogo img{width:158px;height:130px;object-fit:contain}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#c6cad6;text-align:left;border-radius:10px;padding:12px 13px;display:flex;align-items:center;gap:12px;font-weight:600}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#68746b,#5d6b61);color:#fff;box-shadow:inset 0 0 0 1px #829185}.nav .ico{width:20px;text-align:center;font-size:16px;opacity:.9}.nav .adminTag{margin-left:auto;font-size:9px;color:#a9adba}
.profile{position:absolute;left:10px;right:10px;bottom:12px;background:#292c3d;border-radius:13px;padding:10px 11px;display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;background:#e0b34d;color:#fff;display:grid;place-items:center;font-weight:800}.profile b{font-size:12px;color:#fff}.profile small{display:block;color:#aeb3c1;font-size:10px}.logout{margin-left:auto;background:none;border:0;color:#9da3b3;font-size:18px}
.content{margin-left:228px;min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.topTitle{font-size:13px;color:var(--muted)}.topActions{display:flex;gap:8px}.main{padding:28px 30px 40px;max-width:1600px;margin:auto}h1{font-size:28px;letter-spacing:-1px;margin:0 0 22px}h2{margin:0 0 16px}h3{margin:0 0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.hero{border-radius:17px;background:linear-gradient(100deg,#6256d9,#756be7);color:#fff;padding:22px 24px;box-shadow:0 10px 26px #6256d933;margin-bottom:22px}.hero .date{font-size:11px;opacity:.8}.hero strong{display:block;font-size:24px;margin:2px 0}.hero .sub{opacity:.9}.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.kpi{padding:20px;border-radius:17px;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff;min-height:128px;position:relative;overflow:hidden}.kpi .circle{position:absolute;right:18px;top:24px;width:62px;height:62px;border-radius:50%;border:8px solid #e9eaf4}.kpi .num{font-size:25px;font-weight:900;margin-top:8px;letter-spacing:-1px}.kpi .label{font-weight:700;color:#71798c}.kpi .hint{font-size:11px;color:var(--muted);margin-top:4px}.toneP{background:linear-gradient(145deg,#f0efff,#fff)}.toneG{background:linear-gradient(145deg,#eef9f4,#fff)}.toneO{background:linear-gradient(145deg,#fff8ea,#fff)}.toneB{background:linear-gradient(145deg,#eef3ff,#fff)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.section{margin:22px 0}.sectionTitle{font-weight:800;font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}.sectionTitle:before{content:"";width:4px;height:17px;border-radius:4px;background:#1e2432}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{min-width:220px}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:#3a4052}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:#fff1f1;border-color:#f0c7c9;color:#a4474c}.btn.sm{padding:6px 9px;font-size:12px}
input,select,textarea{background:#fff;color:var(--text);border:1px solid #dfe2ea;border-radius:9px;padding:10px 11px;outline:none}input:focus,select:focus,textarea:focus{border-color:#8178e5;box-shadow:0 0 0 3px #6256d914}input[type=date],input[type=month]{color-scheme:light}input[type=date]::-webkit-calendar-picker-indicator,input[type=month]::-webkit-calendar-picker-indicator{opacity:.75;cursor:pointer}
.tableWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid #eef0f4;white-space:nowrap;text-align:left;font-size:12px}th{background:#f8f9fb;color:#667085;font-weight:800;position:sticky;top:0;z-index:1}tr:hover td{background:#fafbfe}.empty{text-align:center;color:var(--muted);padding:30px}.link{background:none;border:0;color:#5b52ce;font-weight:800;text-decoration:underline;padding:0}
.barBox{height:240px;display:flex;align-items:flex-end;gap:12px;padding:15px 10px 34px}.barCol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}.barCol i{display:block;width:min(46px,75%);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#756be7,#6256d9);min-height:5px}.barCol span{position:absolute;bottom:-26px;color:#858da0;font-size:10px}.barCol b{position:absolute;top:auto;bottom:calc(var(--h) + 4px);font-size:10px;color:#5e6577}.miniList{display:flex;flex-direction:column;gap:12px}.miniRow{display:grid;grid-template-columns:95px 1fr 70px;gap:10px;align-items:center;font-size:12px}.track{height:8px;background:#eef0f5;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px}.f1{background:#6256d9}.f2{background:#2d9d71}.f3{background:#d59a39}.f4{background:#4d6ecb}.f5{background:#c95e62}
.modal{position:fixed;inset:0;background:#17203366;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}.box{background:#fff;border-radius:17px;border:1px solid #e3e6ed;width:min(880px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 70px #18203633;padding:22px}.boxHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.closeX{border:0;background:#f1f3f7;border-radius:50%;width:34px;height:34px;color:#667085;font-size:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:11px;color:#778096}.form label input,.form label select,.form label textarea{display:block;width:100%;margin-top:5px}.full{grid-column:1/-1}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1d1f2c 0%,#292d3e 45%,#f2f4f8 45%,#f2f4f8 100%);padding:20px}.loginBox{width:min(440px,100%);background:#fff;border-radius:22px;box-shadow:0 28px 80px #11182733;padding:38px;border:1px solid #e7e9ef}.loginLogo{display:flex;justify-content:center;margin-bottom:12px}.loginLogo img{width:190px;height:150px;object-fit:contain}.loginTitle{text-align:center;font-size:24px;font-weight:900;margin-top:-8px}.loginSub{text-align:center;color:#8a92a5;font-size:10px;letter-spacing:3px;margin:3px 0 24px}.loginBox input{width:100%;margin:5px 0}.loginBox .btn{width:100%;margin-top:10px;height:46px;font-weight:800}.hint{margin-top:13px;text-align:center;color:#9aa1b1;font-size:10px}.settingRow{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:17px 0;border-bottom:1px solid #eef0f4}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#f2f1ff;color:#554cc4;border:1px solid #e4e1ff;border-radius:999px;padding:6px 9px;font-size:11px}.adminOnly{font-size:10px;color:#a2a8b5;margin-left:6px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#fff;border:1px solid var(--line);border-radius:11px;min-height:80px;padding:8px}.day .n{font-weight:800}.day .dot{display:inline-block;margin-top:10px;color:#fff;border-radius:999px;padding:2px 6px;font-size:9px}.userLegend{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px}.userFilter{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#5f687b;background:#fff;border:1px solid #e1e4eb;border-radius:999px;padding:6px 10px;cursor:pointer}.userFilter:hover{border-color:#b9b4ef;background:#f8f7ff}.userFilter.selected{border-color:#6256d9;background:#f1efff;color:#4f46b5;font-weight:800}.userFilter i{width:10px;height:10px;border-radius:50%;display:inline-block}.colorSwatch{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid #d9dce5}.colorPicker{display:flex;align-items:center;gap:10px;margin-top:5px}.colorPicker input{width:48px;height:38px;padding:3px;cursor:pointer}.note{background:#f7f8fb;border:1px solid #e9ebf0;border-radius:10px;padding:11px;color:#737b8e;font-size:11px}
@media(max-width:1050px){.sidebar{width:205px}.content{margin-left:205px}.kgrid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.brandLogo{height:78px;padding:0}.brandLogo img{width:110px;height:75px}.profile{position:static;margin-top:10px}.content{margin-left:0}.topbar{height:58px;padding:0 14px}.main{padding:18px 14px}.kgrid,.grid2,.grid3,.form{grid-template-columns:1fr}.settingRow{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.nav button{padding:9px}.topActions{display:none}}

.brandLogo img,.loginLogo img{object-fit:contain}
.profileBtn{border:0;background:transparent;color:inherit;padding:0;text-align:left;display:flex;align-items:center;gap:9px;min-width:0}.profileBtn div:nth-child(2){min-width:0}.profileBtn b,.profileBtn small{white-space:nowrap}.syncDot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#667085}.syncDot i{width:7px;height:7px;border-radius:50%;background:#2d9d71;display:inline-block}.dangerNote{color:#a4474c}.pwHint{font-size:11px;color:#8a92a5;margin-top:6px}
</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>
